server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API prefixes to the in-cluster backend services.
    # In production these resolve via the cluster DNS names registered by
    # the k8s Service objects (see infra/k8s/*.yaml).
    location /api/knowledge/ {
        proxy_pass http://knowledge-api.ai-employee.svc.cluster.local:8010/;
    }
    location /api/rca/ {
        proxy_pass http://rca-agent.ai-employee.svc.cluster.local:8020/;
    }
    location /api/platform/ {
        proxy_pass http://agent-platform-api.ai-employee.svc.cluster.local:8030/;
    }
    location /api/tools/ {
        proxy_pass http://tool-registry.ai-employee.svc.cluster.local:8040/;
    }
}
