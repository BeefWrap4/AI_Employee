server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API prefixes to backend service names.  Short service
    # names resolve in Docker Compose and in the same Kubernetes namespace.
    location /api/knowledge/ {
        proxy_pass http://knowledge-api:8010/;
    }
    location /api/rca/ {
        proxy_pass http://rca-agent:8020/;
    }
    location /api/platform/ {
        proxy_pass http://agent-platform-api:8030/;
    }
    location /api/tools/ {
        proxy_pass http://tool-registry:8040/;
    }
}
