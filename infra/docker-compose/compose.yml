name: ai-employee

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_employee
      POSTGRES_USER: ai_employee
      POSTGRES_PASSWORD: ai_employee
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_employee -d ai_employee"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: aiEmployee123!
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command: >
      etcd
      --advertise-client-urls=http://127.0.0.1:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd-data:/etcd

  milvus:
    image: milvusdb/milvus:v2.5.11
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    volumes:
      - milvus-data:/var/lib/milvus

  prometheus:
    image: prom/prometheus:v3.4.1
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.0.2
    ports:
      - "3000:3000"
    volumes:
      # R33-G1c: auto-provision datasources + dashboards from the
      # infra/observability/grafana/provisioning tree on startup.
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

  vault:
    # HashiCorp Vault in dev mode (spec §8 治理: Vault/企业密钥管理).
    # dev mode auto-unseals + seeds a root token; not for production.
    image: hashicorp/vault:1.18
    command: server -dev -dev-root-token-id=dev-token -dev-listen-address=0.0.0.0:8200
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    # Kafka in KRaft mode (no Zookeeper) for alarm ingestion (spec P2/P3 §4).
    image: bitnami/kafka:3.9
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_KRAFT_CLUSTER_ID: ai-employee
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    # Neo4j topology graph (spec P2/P3 §4: 基站/小区/传输链路/上游设备拓扑).
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: neo4j/testpassword
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p testpassword 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  influxdb:
    # InfluxDB 2.x time-series DB for KPI queries (spec P2 §4 InfluxDB).
    image: influxdb:2.7
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword
      DOCKER_INFLUXDB_INIT_ORG: ai-employee
      DOCKER_INFLUXDB_INIT_BUCKET: kpi
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: dev-token
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  otel-collector:
    # OpenTelemetry Collector — receives OTLP, forwards to Tempo (spec §可观测).
    image: otel/opentelemetry-collector-contrib:0.112.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    depends_on:
      - tempo

  tempo:
    # Grafana Tempo — trace storage backend for OTel collector.
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"  # tempo query
      - "14268:14268"

  # ------------------------------------------------------------------------ #
  # R21 service isolation (spec §9): standalone approval-service and
  # mcp-gateway.  agent-platform-api points at them via APPROVAL_SERVICE_URL
  # / MCP_GATEWAY_URL when the in-memory fallback isn't desired.
  # ------------------------------------------------------------------------ #

  approval-service:
    # Owns approval task persistence + state machine (R21; spec §9
    # ``approval-service``).  Backed by the shared postgres instance in
    # prod; uses an on-disk SQLite for local docker-compose.
    build:
      context: ../..
      dockerfile: services/approval-service/Dockerfile
    environment:
      APP_PORT: "8040"
      PLATFORM_DATA_DIR: /var/data
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me}
    volumes:
      - approval-data:/var/data
    ports:
      - "8040:8040"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8040/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-gateway:
    # Unified MCP-compatible tool gateway (R21; spec §9 ``mcp-gateway``).
    # Owns tool registration, discovery, invocation + per-tool
    # circuit breaker.
    build:
      context: ../..
      dockerfile: services/mcp-gateway/Dockerfile
    environment:
      APP_PORT: "8050"
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me}
    ports:
      - "8050:8050"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8050/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  event-gateway:
    # Independent Kafka→HTTP alarm forwarder (R29-C; spec §9
    # ``event-gateway``).  Owns the alarm topic subscription that used
    # to live in the rca-agent's lifespan.  Forwards each alarm to the
    # rca-agent over HTTP (``EVENT_GATEWAY_RCA_URL``).  Without this
    # service in the compose stack the rca-agent still serves its
    # HTTP ``/api/v1/alarms/events`` endpoint (HTTP-only fallback).
    build:
      context: ../..
      dockerfile: services/event-gateway/Dockerfile
    environment:
      APP_PORT: "8060"
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ALARM_TOPIC: alarms
      KAFKA_GROUP_ID: event-gateway
      EVENT_GATEWAY_RCA_URL: http://rca-agent:8020
    depends_on:
      - kafka
      - rca-agent
    ports:
      - "8060:8060"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8060/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    # R32-A single ingress-level API gateway (spec §三 §5.1).  Routes
    # /api/{knowledge,rca,platform,tools,approvals,mcp}/* to the six
    # backends and owns auth + rate-limit + audit + trace_id/run_id
    # propagation.  Auth defaults to open (false) so local dev traffic
    # flows; set API_GATEWAY_AUTH_REQUIRED=true to enforce credentials.
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    environment:
      APP_PORT: "8070"
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me}
      API_GATEWAY_AUTH_REQUIRED: "false"
      API_GATEWAY_KNOWLEDGE_API_URL: http://knowledge-api:8010
      API_GATEWAY_RCA_AGENT_URL: http://rca-agent:8020
      API_GATEWAY_AGENT_PLATFORM_API_URL: http://agent-platform-api:8030
      API_GATEWAY_TOOL_REGISTRY_URL: http://tool-registry:8040
      API_GATEWAY_APPROVAL_SERVICE_URL: http://approval-service:8040
      API_GATEWAY_MCP_GATEWAY_URL: http://mcp-gateway:8050
    depends_on:
      - knowledge-api
    ports:
      - "8070:8070"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8070/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  minio-data:
  opensearch-data:
  etcd-data:
  milvus-data:
  grafana-data:
  neo4j-data:
  influxdb-data:
  tempo-data:
  approval-data:
