{{- $global := .Values.global -}}
{{- range $name, $svc := .Values.services -}}
{{- if $svc.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $global.namespace }}
  labels:
    {{- include "ai-employee.labels" $ | nindent 4 }}
    app: {{ $name }}
spec:
  minAvailable: {{ $svc.pdb.minAvailable | default 1 }}
  selector:
    matchLabels:
      app: {{ $name }}
{{- end }}
{{- end }}