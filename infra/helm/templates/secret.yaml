apiVersion: v1
kind: Secret
metadata:
  name: ai-employee-secrets
  namespace: {{ .Values.global.namespace }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.global.secrets.jwtSecret | quote }}
  QWEN_API_KEY: {{ .Values.global.secrets.qwenApiKey | quote }}
  INTERNAL_TOKEN: {{ .Values.global.secrets.internalToken | quote }}
  # R24-A: OIDC / SSO placeholders.  Empty by default so the
  # ``require_oidc_or_internal`` dep falls through to HS256 JWT /
  # internal-token.  Operators wire up the IdP by setting
  # ``global.secrets.oidcIssuer / oidcClientId / oidcAudience /
  # oidcJwksUrl`` in a values overlay (or via ``--set``) and rolling
  # the deployments.
  OIDC_ISSUER: {{ .Values.global.secrets.oidcIssuer | default "" | quote }}
  OIDC_CLIENT_ID: {{ .Values.global.secrets.oidcClientId | default "" | quote }}
  OIDC_AUDIENCE: {{ .Values.global.secrets.oidcAudience | default "" | quote }}
  OIDC_JWKS_URL: {{ .Values.global.secrets.oidcJwksUrl | default "" | quote }}
