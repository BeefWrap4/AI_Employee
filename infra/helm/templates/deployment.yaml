{{- $global := .Values.global -}}
{{- $os := .Values.objectStore -}}
{{- range $name, $svc := .Values.services -}}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $global.namespace }}
  labels:
    {{- include "ai-employee.labels" $ | nindent 4 }}
    app: {{ $name }}
spec:
  {{- if not (hasKey $svc "noHPA") }}
  replicas: {{ $svc.replicas | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "ai-employee.labels" $ | nindent 8 }}
        app: {{ $name }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        # Match the Dockerfile ``appuser`` UID so the container can
        # write /app.  Using uid=1000 here (the previous default) broke
        # writes to /app because the image's appuser is uid=10001.
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: {{ $name }}
          image: "{{ $global.imageRegistry }}/{{ $name }}:{{ $global.imageTag }}"
          imagePullPolicy: {{ $global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          envFrom:
            - configMapRef:
                name: {{ $name }}-config
          env:
            - name: SERVICE_NAME
              value: {{ $name }}
            - name: SERVICE_PORT
              value: {{ $svc.port | quote }}
            - name: OBJECT_STORE_URL
              value: {{ $os.url | default "" | quote }}
            - name: OBJECT_STORE_LOCAL_ROOT
              value: {{ $os.localRoot | default "/var/lib/ai-employee/objects" | quote }}
            - name: OBJECT_STORE_ACCESS_KEY
              value: {{ $os.accessKey | default "" | quote }}
            - name: OBJECT_STORE_SECRET_KEY
              value: {{ $os.secretKey | default "" | quote }}
            - name: OBJECT_STORE_BUCKET
              value: {{ $os.bucket | default "ai-employee" | quote }}
            {{- if or (eq $name "knowledge-api") (eq $name "rca-agent") (eq $name "agent-platform-api") (eq $name "approval-service") }}
            # R29-A: inject the PG DSN into the 4 PG-backed services only
            # when an operator actually set one.  An empty databaseUrl
            # (dev / smoke) omits the var so build_*_store() falls back
            # to the in-process SQLite path — no crash when no Postgres
            # is deployed.
            {{- with $global.databaseUrl }}
            - name: DATABASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if eq $name "agent-platform-api" }}
            # Secrets come from the single ai-employee-secrets Secret
            # (see secret.yaml).  Key names are the UPPER_SNAKE forms
            # matching that Secret — not derived from the values dict
            # keys (which are camelCase), so ``upper`` alone would drop
            # the underscore and miss the key.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ai-employee-secrets
                  key: JWT_SECRET
            - name: QWEN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-employee-secrets
                  key: QWEN_API_KEY
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-employee-secrets
                  key: INTERNAL_TOKEN
            - name: OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: ai-employee-secrets
                  key: OIDC_ISSUER
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ai-employee-secrets
                  key: OIDC_CLIENT_ID
            - name: OIDC_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: ai-employee-secrets
                  key: OIDC_AUDIENCE
            - name: OIDC_JWKS_URL
              valueFrom:
                secretKeyRef:
                  name: ai-employee-secrets
                  key: OIDC_JWKS_URL
            {{- end }}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              {{- if eq $name "agent-platform-api" }}
              path: /health/ready
              {{- else }}
              path: /health
              {{- end }}
              port: {{ $svc.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            {{- if include "ai-employee.hasStorage" $svc.storage }}
            # Stateful services write a SQLite file (or parse artefacts)
            # under their PVC; a read-only root fs would block that.
            readOnlyRootFilesystem: false
            {{- else }}
            # Stateless services still need to write __pycache__ /
            # uvicorn socket dirs; mount an emptyDir writable /tmp via
            # the deployment's tmpfs volume rather than loosening here.
            readOnlyRootFilesystem: true
            {{- end }}
            capabilities:
              drop:
                - ALL
          {{- if include "ai-employee.hasStorage" $svc.storage }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/ai-employee/data
          {{- end }}
      {{- if include "ai-employee.hasStorage" $svc.storage }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data
      {{- end }}
{{- end }}
{{- end }}