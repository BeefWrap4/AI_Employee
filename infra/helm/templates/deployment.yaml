{{- $global := .Values.global -}}
{{- $os := .Values.objectStore -}}
{{- range $name, $svc := .Values.services -}}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $global.namespace }}
  labels:
    {{- include "ai-employee.labels" $ | nindent 4 }}
    app: {{ $name }}
spec:
  {{- if not (hasKey $svc "noHPA") }}
  replicas: {{ $svc.replicas | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "ai-employee.labels" $ | nindent 8 }}
        app: {{ $name }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: {{ $name }}
          image: "{{ $global.imageRegistry }}/{{ $name }}:{{ $global.imageTag }}"
          imagePullPolicy: {{ $global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          envFrom:
            - configMapRef:
                name: {{ $name }}-config
          env:
            - name: SERVICE_NAME
              value: {{ $name }}
            - name: SERVICE_PORT
              value: {{ $svc.port | quote }}
            - name: OBJECT_STORE_URL
              value: {{ $os.url | default "" | quote }}
            - name: OBJECT_STORE_LOCAL_ROOT
              value: {{ $os.localRoot | default "/var/lib/ai-employee/objects" | quote }}
            - name: OBJECT_STORE_ACCESS_KEY
              value: {{ $os.accessKey | default "" | quote }}
            - name: OBJECT_STORE_SECRET_KEY
              value: {{ $os.secretKey | default "" | quote }}
            - name: OBJECT_STORE_BUCKET
              value: {{ $os.bucket | default "ai-employee" | quote }}
            {{- if or (eq $name "knowledge-api") (eq $name "rca-agent") (eq $name "agent-platform-api") (eq $name "approval-service") }}
            # R29-A: inject the default PG DSN into the 4 PG-backed
            # services.  The ``build_*_store()`` factories honour this
            # env var; the env var is omitted for stateless services
            # (ingestion-worker, tool-registry, mcp-gateway) which
            # don't own persistent state.
            - name: DATABASE_URL
              value: {{ $global.databaseUrl | default "postgresql://ai-employee:ai-employee@postgres:5432/ai-employee" | quote }}
            {{- end }}
            {{- if eq $name "agent-platform-api" }}
            {{- range $k, $v := $global.secrets }}
            - name: {{ $k | upper }}
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}-secrets
                  key: {{ $k }}
            {{- end }}
            {{- end }}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ $svc.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          {{- if gt (int $svc.storage) 0 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/ai-employee/data
          {{- end }}
      {{- if gt (int $svc.storage) 0 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data
      {{- end }}
{{- end }}
{{- end }}