{{- $global := .Values.global -}}
{{- range $name, $svc := .Values.services -}}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ $global.namespace }}
  labels:
    {{- include "ai-employee.labels" $ | nindent 4 }}
    app: {{ $name }}
data:
  {{- range $k, $v := $svc.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- if include "ai-employee.hasStorage" $svc.storage }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  namespace: {{ $global.namespace }}
  labels:
    {{- include "ai-employee.labels" $ | nindent 4 }}
    app: {{ $name }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if $global.storageClassName }}
  storageClassName: {{ $global.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $svc.storage }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $global.namespace }}
  labels:
    {{- include "ai-employee.labels" $ | nindent 4 }}
    app: {{ $name }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
  type: ClusterIP
{{- end }}
{{- end }}