{{- if .Values.ingress.enabled }}
{{- $global := .Values.global }}
{{- $services := .Values.services }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-employee-ingress
  namespace: {{ $global.namespace }}
  labels:
    {{- include "ai-employee.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- $paths := dict "knowledge-api" "/api/knowledge" "rca-agent" "/api/rca" "agent-platform-api" "/api/platform" "tool-registry" "/api/tools" }}
          {{- range $svcName, $path := $paths }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $svcName }}
                port:
                  number: {{ (index $services $svcName).port | int }}
          {{- end }}
{{- end }}
