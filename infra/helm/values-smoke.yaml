# Smoke overlay for kind cluster (R34-D expansion).
# All 9 services enabled (event-gateway disabled: needs Kafka broker not
# in kind smoke). Stateful services get PVC + SQLite path; stateless
# services stay read-only root fs. DATABASE_URL unset → all 4 PG-backed
# services fall back to in-process SQLite (per build_*_store() design).
global:
  # R34-D3: real Postgres 16 deployed via infra/k8s/postgres.yaml.  The
  # 4 PG-backed services (knowledge-api, rca-agent, agent-platform-api,
  # approval-service) now switch from SQLite to PG, exercising the
  # build_*_store() PG path in a real cluster.
  databaseUrl: "postgresql://ai-employee:ai-employee@postgres:5432/ai-employee"
  jwtAuthStrict: false
  storageClassName: ""

objectStore:
  url: ""                  # LocalFs

services:
  knowledge-api:
    enabled: true
    replicas: 1
    storage: 1Gi
    env:
      KNOWLEDGE_SQLITE_PATH: "/var/lib/ai-employee/data/knowledge.db"
      EMBEDDING_PROVIDER: qwen
      MILVUS_ENABLED: "false"
      OPENSEARCH_ENABLED: "false"
  ingestion-worker:
    enabled: true
    replicas: 1
    storage: 0
    env:
      EMBEDDING_PROVIDER: qwen
      MILVUS_ENABLED: "false"
      OPENSEARCH_ENABLED: "false"
  rca-agent:
    enabled: true
    replicas: 1
    storage: 1Gi
    env:
      KNOWLEDGE_API_URL: "http://knowledge-api:8010"
      PROMETHEUS_ENABLED: "false"
      ELASTICSEARCH_ENABLED: "false"
      NEO4J_ENABLED: "false"
      TICKET_API_ENABLED: "false"
  agent-platform-api:
    enabled: true
    replicas: 1
    storage: 1Gi
    env:
      EVENT_BUS_BACKEND: memory
      PLATFORM_SQLITE_PATH: "/var/lib/ai-employee/data/platform.db"
    hpa:
      enabled: false
  tool-registry:
    enabled: true
    replicas: 1
    # Stateful: owns ToolRegistryStore (SQLite under ./var).  Needs
    # a PVC + readOnlyRootFilesystem: false in the deployment template.
    storage: 1Gi
    env: {}
  approval-service:
    enabled: true
    replicas: 1
    storage: 1Gi
    env: {}
  mcp-gateway:
    enabled: true
    replicas: 1
    storage: 0
    env: {}
  event-gateway:
    # R29-C: requires Kafka broker (KAFKA_BOOTSTRAP_SERVERS).  Not
    # available in kind smoke; left disabled.
    enabled: false
  api-gateway:
    enabled: true
    replicas: 1
    storage: 0
    env:
      API_GATEWAY_AUTH_REQUIRED: "false"

networkPolicy:
  enabled: false
