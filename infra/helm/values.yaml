# Default values for the ai-employee Helm chart.
# Override per-environment with -f values.<env>.yaml or --set.

global:
  imageRegistry: "ai-employee"
  imageTag: "0.1.0"
  imagePullPolicy: IfNotPresent
  namespace: ai-employee

  # R29-A: default DATABASE_URL points at the cluster-local Postgres
  # Service so a stock ``helm install`` lands on PG without an extra
  # values overlay.  The 4 PG-backed services (knowledge-api,
  # rca-agent, agent-platform-api, approval-service) read this value
  # in deployment.yaml and inject it as a container env var.
  # Operators can override with ``--set global.databaseUrl=...`` for
  # managed PG (RDS, Cloud SQL, ...) or to point at a different
  # in-cluster Postgres instance.  When unset, services fall back to
  # the legacy SQLite path (dev/test mode).
  databaseUrl: "postgresql://ai-employee:ai-employee@postgres:5432/ai-employee"

  # Shared secrets. In production, set these via --set or a sealed-secret
  # rather than committing real values here.
  secrets:
    jwtSecret: "REPLACE_WITH_LONG_RANDOM_SECRET"
    qwenApiKey: "REPLACE_WITH_QWEN_API_KEY"
    internalToken: "REPLACE_WITH_INTERNAL_TOKEN"
    # R24-A: OIDC / SSO placeholders.  Leave empty so the
    # ``require_oidc_or_internal`` dep falls through to HS256 JWT /
    # internal-token.  Wire up an IdP (Keycloak, Auth0, Okta, ...)
    # by setting all four variables in a values overlay; the OIDC
    # branch auto-enables once OIDC_ISSUER + OIDC_CLIENT_ID are set.
    oidcIssuer: ""
    oidcClientId: ""
    oidcAudience: ""
    oidcJwksUrl: ""

  # Auth: set to true to drop the legacy internal-token path (JWT only).
  jwtAuthStrict: false

  storageClassName: ""

# R22: object-store configuration.  When ``url`` is empty the services
# fall back to a LocalFs store under ``OBJECT_STORE_LOCAL_ROOT`` on
# each pod's PVC.  Set ``url`` (e.g. ``http://minio:9000``) to switch
# to S3 / MinIO with the credentials below.
objectStore:
  url: ""                              # "" = LocalFs; "http://minio:9000" = MinIO
  accessKey: "REPLACE_WITH_ACCESS_KEY"
  secretKey: "REPLACE_WITH_SECRET_KEY"
  bucket: "ai-employee"
  localRoot: "/var/lib/ai-employee/objects"
  # MinIO-specific knobs (only used when minio.enabled=true).
  minio:
    enabled: false
    storage: 20Gi
    rootUser: "minioadmin"
    rootPassword: "minioadmin"
    consolePort: 9001

# Per-service overrides.
#
# R23 HA prerequisites (spec §8): a service can run >1 replica only when
# its state is externalised — Postgres (DB), Redis (lease / rate-limit /
# idempotency / event bus), and S3/MinIO (object store).  Services that
# still write to a local SQLite file or a PVC are pinned to 1 replica
# (SQLite is single-writer; a PVC with ReadWriteOnce can't be shared).
# Flip them to 2 only after migrating the service to Postgres and setting
# APPROVAL_SERVICE_URL / MCP_GATEWAY_URL / REDIS_URL / OBJECT_STORE_URL.
services:
  knowledge-api:
    enabled: true
    pdb:
      minAvailable: 1
    port: 8010
    # SQLite-backed (KNOWLEDGE_SQLITE_PATH on the PVC).  Keep 1 until
    # the pg_store backend is the default, then raise to 2 with a
    # shared Postgres + the object store for raw uploads.
    replicas: 1
    storage: 5Gi
    env:
      EMBEDDING_PROVIDER: qwen
      LLM_GATEWAY_ENABLED: "true"
      MILVUS_ENABLED: "false"
      OPENSEARCH_ENABLED: "false"

  ingestion-worker:
    enabled: true
    pdb:
      minAvailable: 1
    port: 8011
    # Stateless once embeddings are offloaded to the shared provider;
    # 2 replicas are safe.  Keep 1 only if a PVC is required for
    # intermediate parse artefacts.
    replicas: 2
    storage: 0
    env:
      EMBEDDING_PROVIDER: qwen
      MILVUS_ENABLED: "false"
      OPENSEARCH_ENABLED: "false"

  rca-agent:
    enabled: true
    pdb:
      minAvailable: 1
    port: 8020
    # Read-only against Prometheus / ES / Neo4j; stateless.  HA-safe.
    replicas: 2
    storage: 2Gi
    env:
      PROMETHEUS_ENABLED: "false"
      ELASTICSEARCH_ENABLED: "false"
      NEO4J_ENABLED: "false"
      TICKET_API_ENABLED: "false"

  agent-platform-api:
    enabled: true
    port: 8030
    # HA: 2 replicas are safe because the scheduler acquires a Redis
    # leader lease (build_leader_election) so only one ticks cron, the
    # idempotency store is Redis-backed (R23-1/2), and the event bus
    # mirrors onto Redis pub/sub (R23-3).  Requires APPROVAL_SERVICE_URL
    # + MCP_GATEWAY_URL so per-pod in-memory state is not the source of
    # truth (R21).
    replicas: 2
    storage: 2Gi
    env:
      EVENT_BUS_BACKEND: redis
    pdb:
      minAvailable: 1
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      cpu: 70
      memory: 75

  tool-registry:
    enabled: true
    pdb:
      minAvailable: 1
    port: 8040
    # Stateless once the tool registry is delegated to mcp-gateway
    # (MCP_GATEWAY_URL).  2 replicas are safe in that mode.
    replicas: 2
    storage: 1Gi
    env: {}

  # R21 standalone services (spec §9).  Both are Postgres/Redis-backed
  # and therefore HA-safe at 2 replicas.
  approval-service:
    enabled: true
    pdb:
      minAvailable: 1
    port: 8060
    # Owns approval task state machine + persistence.  HA-safe when
    # backed by Postgres (PLATFORM_DB_BACKEND=postgres); with the
    # default SQLite keep at 1.
    replicas: 2
    storage: 1Gi
    env: {}

  mcp-gateway:
    enabled: true
    pdb:
      minAvailable: 1
    port: 8050
    # Owns tool registry / discovery / invocation.  HA-safe when the
    # tool store is externalised (Postgres or Redis); 2 replicas.
    replicas: 2
    storage: 0
    env: {}

  # R29-C: standalone event-gateway (spec §9 ``event-gateway``).
  # Owns the Kafka alarm subscription (was in rca-agent's lifespan
  # pre-R29-C); forwards each alarm via HTTP to rca-agent.  HA-safe
  # because the Kafka consumer group rebalances partitions across
  # replicas.
  event-gateway:
    enabled: true
    pdb:
      minAvailable: 1
    port: 8060
    replicas: 2
    storage: 0
    env:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_ALARM_TOPIC: "alarms"
      KAFKA_GROUP_ID: "event-gateway"
      EVENT_GATEWAY_RCA_URL: "http://rca-agent:8020"

  # R32-A: single ingress-level API gateway (spec §三 §5.1).  Routes
  # /api/{knowledge,rca,platform,tools,approvals,mcp}/* to the six
  # backends and owns auth + rate-limit + audit + trace_id/run_id
  # propagation.  Stateless; HA-safe at 2 replicas.  Auth defaults to
  # open (false) so dev/test traffic flows — flip API_GATEWAY_AUTH_REQUIRED
  # to "true" (via a values overlay) to enforce JWT/X-Internal-Token in
  # production.  Backend URLs default to the in-cluster Service DNS.
  api-gateway:
    enabled: true
    pdb:
      minAvailable: 1
    port: 8070
    replicas: 2
    storage: 0
    env:
      API_GATEWAY_AUTH_REQUIRED: "false"
      API_GATEWAY_KNOWLEDGE_API_URL: "http://knowledge-api:8010"
      API_GATEWAY_RCA_AGENT_URL: "http://rca-agent:8020"
      API_GATEWAY_AGENT_PLATFORM_API_URL: "http://agent-platform-api:8030"
      API_GATEWAY_TOOL_REGISTRY_URL: "http://tool-registry:8040"
      API_GATEWAY_APPROVAL_SERVICE_URL: "http://approval-service:8040"
      API_GATEWAY_MCP_GATEWAY_URL: "http://mcp-gateway:8050"

# Optional ingress for the platform API + web portal.
ingress:
  enabled: false
  className: nginx
  host: ai-employee.local
# Network policy: deny-by-default with intra-namespace allow.
networkPolicy:
  enabled: true
