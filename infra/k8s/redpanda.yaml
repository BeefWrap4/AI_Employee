# R35-D1: in-cluster Redpanda (Kafka-compatible, KRaft mode) for kind smoke.
#
# The event-gateway service needs a Kafka broker to subscribe to the
# ``alarms`` topic.  This manifest deploys a single-node Redpanda
# cluster in KRaft mode (no zookeeper, no controller quorum) so the
# kind smoke overlay can stand up a real broker and enable
# event-gateway.  The same env-gated
# ``KAFKA_BOOTSTRAP_SERVERS=kafka:9092`` works unchanged.
#
# Apply:  kubectl apply -f infra/k8s/redpanda.yaml
#
# NOT FOR PRODUCTION — the ``--mode=mode-unsafe-bypass-fsync`` flag
# trades durability for fast local bring-up.  Use a real managed
# Kafka / MSK / Confluent Cloud for prod.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redpanda-data
  namespace: ai-employee
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: ai-employee
  labels:
    app: redpanda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      # Redpanda's official image runs as root and writes /var/lib/redpanda/data.
      # The kind-smoke cluster is ephemeral so we don't add a non-root user.
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.1.7
          command: ["/usr/bin/rpk"]
          args:
            - redpanda
            - start
            - --mode=mode-unsafe-bypass-fsync
            - --smp=1
            - --memory=512M
            - --reserve-memory=0M
            - --overprovisioned
            - --node-id=0
            - --check=false
            - --kafka-addr=PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr=PLAINTEXT://kafka.ai-employee.svc.cluster.local:9092
          ports:
            - name: kafka
              containerPort: 9092
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redpanda-data
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: ai-employee
  labels:
    app: redpanda
spec:
  selector:
    app: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
  type: ClusterIP
