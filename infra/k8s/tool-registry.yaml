apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tool-registry-data
  namespace: ai-employee
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tool-registry-config
  namespace: ai-employee
data:
  PLATFORM_DATA_DIR: "/var/lib/ai-employee/tools"
  JWT_AUTH_STRICT: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tool-registry
  namespace: ai-employee
  labels:
    app: tool-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tool-registry
  template:
    metadata:
      labels:
        app: tool-registry
    spec:
      containers:
        - name: tool-registry
          image: ai-employee/tool-registry:0.1.0
          ports:
            - containerPort: 8040
          envFrom:
            - configMapRef:
                name: tool-registry-config
            - secretRef:
                name: ai-employee-secrets
          volumeMounts:
            - name: data
              mountPath: /var/lib/ai-employee/tools
          readinessProbe:
            httpGet:
              path: /health
              port: 8040
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tool-registry-data
---
apiVersion: v1
kind: Service
metadata:
  name: tool-registry
  namespace: ai-employee
spec:
  selector:
    app: tool-registry
  ports:
    - port: 8040
      targetPort: 8040
  type: ClusterIP
