apiVersion: v1
kind: ConfigMap
metadata:
  name: ingestion-worker-config
  namespace: ai-employee
data:
  KNOWLEDGE_DATA_DIR: "/var/lib/ai-employee/data"
  EMBEDDING_PROVIDER: "qwen"
  MILVUS_ENABLED: "false"
  OPENSEARCH_ENABLED: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-worker
  namespace: ai-employee
  labels:
    app: ingestion-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion-worker
  template:
    metadata:
      labels:
        app: ingestion-worker
    spec:
      containers:
        - name: ingestion-worker
          image: ai-employee/ingestion-worker:0.1.0
          ports:
            - containerPort: 8011
          envFrom:
            - configMapRef:
                name: ingestion-worker-config
            - secretRef:
                name: ai-employee-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8011
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-worker
  namespace: ai-employee
spec:
  selector:
    app: ingestion-worker
  ports:
    - port: 8011
      targetPort: 8011
  type: ClusterIP
