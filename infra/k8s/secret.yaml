# Shared secrets for the AI Employee platform.
# Replace the base64 placeholders with real values before applying.
#   JWT_SECRET        — HS256 signing key for cross-service JWTs (>= 32 bytes)
#   QWEN_API_KEY      — DashScope / Qwen API key for embeddings + LLM
#   INTERNAL_TOKEN    — legacy shared secret for internal-token migration
#   OIDC_ISSUER       — R24-A: IdP issuer (leave blank to keep SSO disabled)
#   OIDC_CLIENT_ID    — R24-A: API client/audience the IdP targets
#   OIDC_AUDIENCE     — R24-A: optional audience override; defaults to OIDC_CLIENT_ID
#   OIDC_JWKS_URL     — R24-A: JWKS endpoint exposed by the IdP
apiVersion: v1
kind: Secret
metadata:
  name: ai-employee-secrets
  namespace: ai-employee
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_WITH_LONG_RANDOM_SECRET"
  QWEN_API_KEY: "REPLACE_WITH_QWEN_API_KEY"
  INTERNAL_TOKEN: "REPLACE_WITH_INTERNAL_TOKEN"
  # R24-A: OIDC / SSO.  Empty values keep the OIDC branch disabled so
  # ``require_oidc_or_internal`` falls through to HS256 JWT / internal
  # token.  Wire up an IdP by setting the four variables here and
  # restarting the deployments.
  OIDC_ISSUER: ""
  OIDC_CLIENT_ID: ""
  OIDC_AUDIENCE: ""
  OIDC_JWKS_URL: ""
