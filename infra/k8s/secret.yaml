# Shared secrets for the AI Employee platform.
# Replace the base64 placeholders with real values before applying.
#   JWT_SECRET        — HS256 signing key for cross-service JWTs (>= 32 bytes)
#   QWEN_API_KEY      — DashScope / Qwen API key for embeddings + LLM
#   INTERNAL_TOKEN    — legacy shared secret for internal-token migration
apiVersion: v1
kind: Secret
metadata:
  name: ai-employee-secrets
  namespace: ai-employee
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_WITH_LONG_RANDOM_SECRET"
  QWEN_API_KEY: "REPLACE_WITH_QWEN_API_KEY"
  INTERNAL_TOKEN: "REPLACE_WITH_INTERNAL_TOKEN"
