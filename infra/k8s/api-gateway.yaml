apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: ai-employee
data:
  # R32-A: single ingress-level API gateway (spec §三 §5.1).  Routes
  # /api/{knowledge,rca,platform,tools,approvals,mcp}/* to the six
  # backends.  Auth defaults to open (false) so dev/test traffic flows;
  # flip to "true" in production to enforce JWT/X-Internal-Token on
  # every routed call.  Backend URLs default to the in-cluster Service
  # DNS names and can be overridden per-backend.
  API_GATEWAY_AUTH_REQUIRED: "false"
  API_GATEWAY_KNOWLEDGE_API_URL: "http://knowledge-api.ai-employee.svc.cluster.local:8010"
  API_GATEWAY_RCA_AGENT_URL: "http://rca-agent.ai-employee.svc.cluster.local:8020"
  API_GATEWAY_AGENT_PLATFORM_API_URL: "http://agent-platform-api.ai-employee.svc.cluster.local:8030"
  API_GATEWAY_TOOL_REGISTRY_URL: "http://tool-registry.ai-employee.svc.cluster.local:8040"
  API_GATEWAY_APPROVAL_SERVICE_URL: "http://approval-service.ai-employee.svc.cluster.local:8040"
  API_GATEWAY_MCP_GATEWAY_URL: "http://mcp-gateway.ai-employee.svc.cluster.local:8050"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ai-employee
  labels:
    app: api-gateway
spec:
  # Stateless (no PVC; routing + audit are per-pod).  HA-safe at 2
  # replicas — the gateway holds no session state, so a rolling update
  # or a pod loss is transparent to callers.
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ai-employee/api-gateway:0.1.0
          ports:
            - containerPort: 8070
          envFrom:
            - configMapRef:
                name: api-gateway-config
            - secretRef:
                name: ai-employee-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8070
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8070
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ai-employee
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8070
      targetPort: 8070
  type: ClusterIP
