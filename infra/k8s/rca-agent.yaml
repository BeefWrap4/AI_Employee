apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rca-agent-data
  namespace: ai-employee
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rca-agent-config
  namespace: ai-employee
data:
  RCA_DATA_DIR: "/var/lib/ai-employee/rca"
  RCA_SQLITE_PATH: "/var/lib/ai-employee/rca/rca.sqlite3"
  KNOWLEDGE_API_URL: "http://knowledge-api.ai-employee.svc.cluster.local:8010"
  # Real data-source adapters are off by default (fixture fallback).
  PROMETHEUS_ENABLED: "false"
  ELASTICSEARCH_ENABLED: "false"
  NEO4J_ENABLED: "false"
  TICKET_API_ENABLED: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rca-agent
  namespace: ai-employee
  labels:
    app: rca-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rca-agent
  template:
    metadata:
      labels:
        app: rca-agent
    spec:
      containers:
        - name: rca-agent
          image: ai-employee/rca-agent:0.1.0
          ports:
            - containerPort: 8020
          envFrom:
            - configMapRef:
                name: rca-agent-config
            - secretRef:
                name: ai-employee-secrets
          volumeMounts:
            - name: data
              mountPath: /var/lib/ai-employee/rca
          readinessProbe:
            httpGet:
              path: /health
              port: 8020
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rca-agent-data
---
apiVersion: v1
kind: Service
metadata:
  name: rca-agent
  namespace: ai-employee
spec:
  selector:
    app: rca-agent
  ports:
    - port: 8020
      targetPort: 8020
  type: ClusterIP
