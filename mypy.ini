[mypy]
python_version = 3.11
namespace_packages = True
explicit_package_bases = True
ignore_missing_imports = True
warn_unused_ignores = False
warn_redundant_casts = True
check_untyped_defs = False
# Gradual typing: shared packages are checked, services are not yet strict.
files = packages/common-schemas/src, packages/auth-policy/src, packages/observability/src, packages/llm-gateway/src

[mypy-pydantic.*]
ignore_missing_imports = True

[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-httpx.*]
ignore_missing_imports = True

[mypy-jwt.*]
ignore_missing_imports = True
