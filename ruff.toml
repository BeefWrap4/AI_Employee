# Ruff configuration for the AI Employee monorepo.
target-version = "py310"
line-length = 100
extend-exclude = ["apps", "infra", ".venv"]

[lint]
# Enable a pragmatic rule set: errors + common bugbear + import sorting.
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]
ignore = [
  "E501",   # line length handled by formatter
  "E741",   # ambiguous variable name (legacy test names like `l`)
  "B008",   # function call in default arg (FastAPI Depends pattern)
  "B904",   # raise-from in except — to be cleaned up incrementally
  "SIM105", # contextlib.suppress refactor — existing try/except/pass is fine
  "SIM108", # ternary vs if-else — readability preference
  "SIM117", # nested with — readability preference in tests
  "RUF001", # ambiguous unicode (CJK punctuation in comments/strings)
  "RUF002",
  "RUF003",
  "RUF012", # mutable class-default ClassVar — existing pattern
]

[lint.per-file-ignores]
"tests/**" = ["B017", "S101", "F841"]
"**/__main__.py" = ["E402"]

[format]
quote-style = "double"
indent-style = "space"
