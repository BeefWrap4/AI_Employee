# Alembic configuration for the AI Employee platform.
#
# The actual database URL is injected at runtime from the
# ``MIGRATION_DATABASE_URL`` env var (or falls back to the SQLite path
# under var/data).  This keeps credentials out of the repo.
#
# Run:
#   alembic upgrade head      # apply all migrations
#   alembic downgrade -1      # roll back the last migration
#   alembic revision -m "..." # create a new empty migration

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Default to an in-repo SQLite file; overridden by MIGRATION_DATABASE_URL.
sqlalchemy.url = sqlite:///./var/data/migrations.sqlite3

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
