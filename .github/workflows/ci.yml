name: CI

on:
  push:
    branches:
      - master
      - "codex/**"
  pull_request:

# Concurrency: cancel in-progress runs on the same branch when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------- #
  # Python — lint / typecheck / security / tests across multiple Python versions
  # --------------------------------------------------------------------- #
  python:
    name: python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check packages services tests

      - name: Format check
        run: ruff format --check packages services tests

      - name: MyPy type check
        run: mypy packages/llm-gateway packages/observability packages/common-schemas || true

      - name: Bandit security scan
        run: bandit -r packages services -q --exclude tests

      - name: Run pytest
        run: python -m pytest --tb=short -q

  # --------------------------------------------------------------------- #
  # Frontend — vitest in the web-portal
  # --------------------------------------------------------------------- #
  frontend:
    name: frontend (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web-portal/package-lock.json
      - run: npm ci || npm install
      - run: npx vitest run

  # --------------------------------------------------------------------- #
  # Helm chart render sanity
  # --------------------------------------------------------------------- #
  helm:
    name: helm-template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Helm lint
        run: helm lint infra/helm
      - name: Helm template render
        run: helm template ai-employee infra/helm > /tmp/rendered.yaml
      - name: Validate YAML
        run: |
          python -c "
          import yaml, sys
          docs = list(yaml.safe_load_all(open('/tmp/rendered.yaml')))
          kinds = [d.get('kind') for d in docs if d]
          print(f'rendered {len(docs)} documents: {sorted(set(kinds))}')
          assert 'Deployment' in kinds, 'no Deployment rendered'
          assert 'Service' in kinds, 'no Service rendered'
          "

  # --------------------------------------------------------------------- #
  # Docker images — build each service's Dockerfile (no push, sanity only)
  # --------------------------------------------------------------------- #
  docker-build:
    name: docker-${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - knowledge-api
          - ingestion-worker
          - rca-agent
          - agent-platform-api
          - tool-registry
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        run: |
          docker build \
            --build-arg SERVICE_NAME=${{ matrix.service }} \
            -t ai-employee/${{ matrix.service }}:ci-${{ github.sha }} \
            --load \
            -f services/${{ matrix.service }}/Dockerfile \
            services/
      - name: Smoke test
        run: |
          docker run --rm --entrypoint python ai-employee/${{ matrix.service }}:ci-${{ github.sha }} -c "import ai_employee; print('ok')"

  # --------------------------------------------------------------------- #
  # Aggregate gate
  # --------------------------------------------------------------------- #
  all-green:
    name: all-green
    needs: [python, frontend, helm, docker-build]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Check upstream results
        run: |
          for j in python frontend helm docker-build; do
            if [ "${{ needs.$j.result }}" != "success" ]; then
              echo "::error::job $j = ${{ needs.$j.result }}"
              exit 1
            fi
          done
          echo "all upstream jobs passed"