[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q
pythonpath =
    services/knowledge-api/src
    services/ingestion-worker/src
    packages/common-schemas/src
    services/eval-service/src
    services/rca-agent/src
    services/agent-platform-api/src
    packages/llm-gateway/src
    packages/observability/src
    packages/auth-policy/src
    services/tool-registry/src
    services/approval-service/src
    services/mcp-gateway/src
    services/event-gateway/src
    packages/object-store/src
    packages/rate-limit/src
    services/api-gateway/src
markers =
    e2e: end-to-end tests requiring docker-compose (PG+Redis) and running services
